name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Syntax check
        run: |
          bash -n deshitify-brave.sh
          bash -n deshitify-brave-linux.sh

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning

      - name: Dry-run smoke test (non-macOS guard)
        run: |
          # Should fail cleanly with a friendly message on non-macOS runners.
          if ./deshitify-brave.sh --dry-run; then
            echo "Expected the macOS guard to reject a non-Darwin runner" >&2
            exit 1
          fi

      - name: Dry-run smoke test (Linux)
        run: |
          ./deshitify-brave-linux.sh --dry-run
          ./deshitify-brave-linux.sh --dry-run --aggressive | tail -n +3 | python3 -m json.tool > /dev/null

  lint-windows:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Syntax check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("deshitify-brave.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          # Write-Host is intentional here (interactive CLI tool, not a pipeline function).
          # BOM-less UTF-8 is intentional too — Windows PowerShell 5.1 still reads it fine
          # since the file has no BOM-dependent parsing, and BOMs break POSIX tools/git diffs.
          $results = Invoke-ScriptAnalyzer -Path deshitify-brave.ps1 -Severity Warning `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseBOMForUnicodeEncodedFile
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

      - name: Dry-run smoke test
        shell: pwsh
        run: .\deshitify-brave.ps1 -DryRun
